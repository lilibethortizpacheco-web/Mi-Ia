<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSHACK LEGAL AI - By Esteban</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--text:#241a13;--accent:#f0862a;--side:#1a1512;--card:#fff;--border:#ece2d6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh}
.sidebar{width:286px;background:var(--side);color:#f7f2e9;display:flex;flex-direction:column;padding:20px}
.logo{font-family:'Fraunces',serif;font-size:24px;color:var(--accent);margin-bottom:20px}
.btn-new{background:var(--accent);border:none;padding:12px;border-radius:12px;color:#000;font-weight:700;cursor:pointer;width:100%}
.main{flex:1;display:flex;flex-direction:column}
.topbar{padding:16px 24px;border-bottom:1px solid var(--border);font-weight:700;display:flex;justify-content:space-between}
.chat{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.bubble{max-width:75%;padding:14px 18px;border-radius:16px;line-height:1.5}
.user{align-self:flex-end;background:#2a1e16;color:#f7f2e9;border-bottom-right-radius:6px}
.ai{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:6px}
.composer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:12px}
.composer textarea{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);resize:none;font-family:inherit}
.composer button{background:var(--accent);border:none;padding:12px 20px;border-radius:12px;font-weight:700;cursor:pointer}
.welcome{text-align:center;margin-top:60px}
.badge{background:#ffe6cc;color:var(--accent);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.prompts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.prompt-card{background:var(--card);border:1px solid var(--border);padding:14px;border-radius:12px;cursor:pointer;text-align:left}
.prompt-card:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="sidebar">
<div class="logo">SYSHACK LEGAL AI</div>
<button class="btn-new" onclick="nuevoChat()">+ Nuevo chat</button>
<div id="historial" style="margin-top:20px;flex:1;overflow-y:auto;font-size:14px;opacity:0.8"></div>
<div style="font-size:12px;opacity:0.6;margin-top:10px">Creada por Esteban David Cervantes Ortiz<br>100% Legal & Ética</div>
</div>
<div class="main">
<div class="topbar"><span>Experta en Hacks Legales / Hardware / Software</span><span style="color:var(--accent)">● Legal</span></div>
<div class="chat" id="chat">
<div class="welcome" id="welcome">
<div class="badge">MODO LEGAL ACTIVADO</div>
<h1 style="font-family:Fraunces;margin:16px 0">¿Qué vamos a reparar hoy, mi hermano?</h1>
<p>Soy experta en trucos legales para tu PC, no enseño nada ilegal.</p>
<div class="prompts">
<button class="prompt-card" onclick="preguntar(this)">Mi Dell 790 no da video y entra en Power Save</button>
<button class="prompt-card" onclick="preguntar(this)">Hack legal para ver mi clave WiFi olvidada</button>
<button class="prompt-card" onclick="preguntar(this)">Error 0xC000021A, cómo reparo sin formatear</button>
<button class="prompt-card" onclick="preguntar(this)">Hack legal para acelerar Windows 10 viejo</button>
</div>
</div>
</div>
<div class="composer">
<textarea id="input" rows="1" placeholder="Escribe tu problema... (solo cosas legales, mi hermano)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviar()}"></textarea>
<button onclick="enviar()">Enviar</button>
</div>
</div>
<script>
const hacks = {
"dell": `Mi hermano, Dell 790 sin video es clásico. Haz esto LEGAL:\n1. Desconecta todo y quita corriente\n2. Quita la pila CR2032 5 min (resetea BIOS)\n3. Limpia RAM con borrador de lápiz\n4. Prueba con 1 sola RAM en slot 1\n5. Si luz ámbar fija = fuente. Si pita 3 veces = RAM. Gracias a Dios eso lo revive 90%.`,
"wifi": `Hack LEGAL para TU propia WiFi:\nEn CMD como admin escribe:\nnetsh wlan show profile\nnetsh wlan show profile name="NOMBRE_DE_TU_WIFI" key=clear\nAhí en "Contenido de la clave" sale. Solo funciona si ya te conectaste antes a TU red.`,
"0xc000021a": `Error 0xC000021A LEGAL fix sin formatear:\n1. Bootea con USB de Windows 10 (Ventoy)\n2. Reparar > Símbolo del sistema\n3. Escribe:\nchkdsk C: /f /r /x\nsfc /scannow /offbootdir=C:\\ /offwindir=C:\\Windows\nDism /Image:C:\\ /Cleanup-Image /RestoreHealth\nReinicia. Salvas todo.`,
"acelerar": `Hack LEGAL para acelerar PC viejo:\nPowerShell como admin:\n1. powercfg /h off (quita hibernación)\n2. Desactiva SysMain: net stop SysMain\n3. Limpia temporales: cleanmgr /sagerun:1\nNo instales optimizadores raros, mi hermano.`,
"default": `Mi hermano, eso que me pides lo hacemos LEGAL:\nDime si es TU equipo y con TU permiso, y te doy el comando exacto.\nNo enseño a hackear cuentas ajenas, ni WiFi de vecinos, ni contraseñas de nadie. Pero para reparar, optimizar y proteger tu PC soy la dura.\n¿Qué equipo es y qué falla tiene?`
};
function esIlegal(t){
  const malas = ["hackear facebook","hackear whatsapp","hackear instagram","hackear vecino","hackear wifi vecino","robar contraseña","keylogger espiar","ransomware","hackear banco"];
  return malas.some(p=>t.toLowerCase().includes(p));
}
function getRespuesta(texto){
  const t = texto.toLowerCase();
  if(esIlegal(t)) return "Mi hermano, eso es ilegal y no te lo puedo enseñar. Pero te enseño cómo PROTEGERTE de eso legalmente. Si quieres defender tu cuenta, activa 2FA y cambia clave. ¿Quieres que te enseñe a protegerte?";
  if(t.includes("dell")||t.includes("power save")||t.includes("video")) return hacks.dell;
  if(t.includes("wifi")||t.includes("clave")) return hacks.wifi;
  if(t.includes("0xc000")||t.includes("021a")) return hacks["0xc000021a"];
  if(t.includes("lento")||t.includes("acelerar")) return hacks.acelerar;
  return hacks.default;
}
function nuevoChat(){document.getElementById('chat').innerHTML=document.getElementById('welcome').outerHTML; document.getElementById('historial').innerHTML='';}
function preguntar(el){document.getElementById('input').value=el.innerText; enviar();}
function enviar(){
  const input=document.getElementById('input');
  const texto=input.value.trim(); if(!texto) return;
  const welcome=document.getElementById('welcome'); if(welcome) welcome.style.display='none';
  const chat=document.getElementById('chat');
  chat.innerHTML+=`<div class="bubble user">${texto}</div>`;
  input.value='';
  const idTyping = 'typing-'+Date.now();
  chat.innerHTML+=`<div class="bubble ai" id="${idTyping}">●●● escribiendo...</div>`;
  chat.scrollTop=chat.scrollHeight;
  setTimeout(()=>{
    const resp=getRespuesta(texto).replace(/\n/g,'<br>');
    document.getElementById(idTyping).innerHTML=resp;
    chat.scrollTop=chat.scrollHeight;
  },800);
}
</script>
</body>
</html>
