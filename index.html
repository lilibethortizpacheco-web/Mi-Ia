<title>UPDATE V1 — IA costeña de Esteban David Cervantes Ortiz</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Manrope:wght@300..700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #faf6ef;
    --fg: #241a13;
    --card: #ffffff;
    --muted: #8c7b6c;
    --border: #ece2d6;
    --accent: #f0862a;
    --accent-fg: #2a1b0d;
    --side: #1a1512;
    --side-text: #f7f2e9;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Manrope", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  /* ===== Sidebar ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 30; background: rgba(26, 21, 18, 0.5);
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 40; width: 286px;
    display: flex; flex-direction: column;
    background: var(--side); color: var(--side-text);
    transform: translateX(-100%); transition: transform 0.3s ease;
  }
  .sidebar.open { transform: translateX(0); }
  .side-head { display: flex; align-items: center; gap: 12px; padding: 22px 20px 18px; }
  .mark {
    width: 40px; height: 40px; display: grid; place-items: center; flex: none;
    border-radius: 14px; background: var(--accent); color: var(--accent-fg);
    font-family: "Fraunces", Georgia, serif; font-size: 18px; font-weight: 600;
    box-shadow: 0 6px 20px -6px rgba(240, 134, 42, 0.8);
  }
  .brand { flex: 1; min-width: 0; }
  .brand strong { display: block; font-family: "Fraunces", Georgia, serif; font-size: 17px; letter-spacing: -0.01em; }
  .brand span { display: block; margin-top: 4px; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255, 255, 255, 0.4); }
  .icon-btn {
    border: 0; background: transparent; color: rgba(255, 255, 255, 0.5);
    padding: 6px; border-radius: 10px; cursor: pointer; line-height: 0;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
  .new-chat {
    margin: 0 16px; width: calc(100% - 32px); display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-radius: 12px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 500;
    color: rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .new-chat:hover { background: rgba(255, 255, 255, 0.11); border-color: rgba(240, 134, 42, 0.6); }
  .side-label {
    padding: 24px 24px 8px; margin: 0; font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase; color: rgba(255, 255, 255, 0.35);
  }
  .conv-list { flex: 1; overflow-y: auto; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 4px; }
  .conv-empty { padding: 8px 12px 24px; font-size: 13px; line-height: 1.6; color: rgba(255, 255, 255, 0.35); margin: 0; }
  .conv {
    position: relative; display: flex; align-items: center; gap: 8px;
    border-radius: 12px; padding: 4px 6px 4px 12px;
  }
  .conv:hover { background: rgba(255, 255, 255, 0.06); }
  .conv.active { background: rgba(255, 255, 255, 0.1); }
  .conv button { border: 0; background: transparent; font: inherit; cursor: pointer; color: inherit; }
  .conv-open {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    padding: 8px 0; text-align: left; font-size: 13px; color: rgba(255, 255, 255, 0.65);
  }
  .conv.active .conv-open { color: #fff; }
  .conv-open span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-del { padding: 6px; border-radius: 8px; color: rgba(255, 255, 255, 0.28); opacity: 0; transition: opacity 0.15s; }
  .conv:hover .conv-del, .conv.active .conv-del { opacity: 1; }
  .conv-del:hover { background: rgba(255, 255, 255, 0.1); color: #ffb4b4; }
  .side-foot { border-top: 1px solid rgba(255, 255, 255, 0.1); padding: 16px; }
  .user { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 999px;
    background: rgba(255, 255, 255, 0.1); font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, 0.85);
  }
  .user p { margin: 0; min-width: 0; }
  .user .name { font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, 0.9); }
  .user .mail { font-size: 11px; color: rgba(255, 255, 255, 0.35); overflow: hidden; text-overflow: ellipsis; }
  .credit { margin: 12px 0 0; font-size: 10px; line-height: 1.6; color: rgba(255, 255, 255, 0.25); }

  /* ===== Chat ===== */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: rgba(250, 246, 239, 0.9);
  }
  .topbar .menu { color: var(--fg); padding: 8px; border-radius: 10px; border: 0; background: transparent; cursor: pointer; }
  .topbar .menu:hover { background: #f0e8dc; }
  .topbar h1 {
    margin: 0; flex: 1; min-width: 0; font-family: "Fraunces", Georgia, serif;
    font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 999px; background: #2f9e83; flex: none; }
  .topbar small { font-size: 11px; color: var(--muted); }

  .scroll { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
  .inner { max-width: 720px; margin: 0 auto; }

  .welcome { padding: 24px 0 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    background: rgba(240, 134, 42, 0.14); color: #a95c12; font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .welcome h2 {
    font-family: "Fraunces", Georgia, serif; font-size: 30px; line-height: 1.1;
    letter-spacing: -0.02em; margin: 16px 0 10px;
  }
  .welcome h2 em { font-style: italic; color: #c96a13; }
  .welcome p { color: var(--muted); font-size: 15px; line-height: 1.65; margin: 0 0 22px; max-width: 44ch; }
  .prompts { display: grid; gap: 8px; grid-template-columns: 1fr; }
  .prompt {
    text-align: left; font: inherit; font-size: 14px; line-height: 1.4; cursor: pointer;
    padding: 14px 16px; border-radius: 14px; color: var(--fg);
    background: var(--card); border: 1px solid var(--border);
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .prompt:hover { border-color: rgba(240, 134, 42, 0.6); box-shadow: 0 10px 24px -18px rgba(36, 26, 19, 0.5); transform: translateY(-1px); }

  .msgs { display: flex; flex-direction: column; gap: 14px; padding: 8px 0 4px; }
  .row { display: flex; gap: 10px; animation: rise 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .row.user { flex-direction: row-reverse; }
  .bot-mark {
    width: 32px; height: 32px; flex: none; margin-top: 2px; display: grid; place-items: center;
    border-radius: 12px; background: var(--accent); color: var(--accent-fg);
    font-family: "Fraunces", Georgia, serif; font-size: 13px; font-weight: 700;
  }
  .bubble {
    max-width: 86%; padding: 12px 16px; border-radius: 16px;
    font-size: 15px; line-height: 1.6; white-space: normal; overflow-wrap: anywhere;
  }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { margin: 0 0 10px; padding-left: 20px; }
  .bubble li { margin-bottom: 4px; }
  .bubble strong { font-weight: 700; }
  .row.assistant .bubble {
    background: var(--card); border: 1px solid var(--border);
    border-bottom-left-radius: 6px; box-shadow: 0 1px 2px rgba(36, 26, 19, 0.04);
  }
  .row.user .bubble {
    background: #2a1e16; color: #f7f2e9; border-bottom-right-radius: 6px;
  }
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 999px; background: var(--muted); opacity: 0.5;
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.2s; }
  .typing i:nth-child(3) { animation-delay: 0.4s; }

  /* ===== Composer ===== */
  .composer-wrap { padding: 8px 16px 18px; }
  .composer-inner { max-width: 720px; margin: 0 auto; }
  .composer {
    display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px;
    border-radius: 22px; background: var(--card); border: 1px solid var(--border);
    box-shadow: 0 10px 30px -18px rgba(36, 26, 19, 0.35); transition: border-color 0.2s, box-shadow 0.2s;
  }
  .composer:focus-within { border-color: rgba(240, 134, 42, 0.7); box-shadow: 0 12px 34px -16px rgba(240, 134, 42, 0.45); }
  .composer textarea {
    flex: 1; min-height: 38px; max-height: 168px; padding: 9px 0; resize: none;
    border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px;
    line-height: 1.6; color: var(--fg);
  }
  .composer textarea::placeholder { color: #a99a8b; }
  .send {
    width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 0; cursor: pointer;
    border-radius: 999px; background: #2a1e16; color: #f7f2e9; transition: all 0.2s;
  }
  .send:hover:not(:disabled) { background: var(--accent); color: var(--accent-fg); transform: scale(1.05); }
  .send:disabled { background: #efe7db; color: #a99a8b; cursor: default; }
  .hint { margin: 8px 0 0; text-align: center; font-size: 11px; color: #a99a8b; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 0.9; } }

  @media (min-width: 1024px) {
    .overlay { display: none; }
    .sidebar { position: static; transform: none; }
    .topbar .menu { display: none; }
    .side-head .icon-btn { display: none; }
    .scroll { padding: 28px 24px 8px; }
    .composer-wrap { padding: 8px 24px 20px; }
    .prompts { grid-template-columns: 1fr 1fr; }
    .welcome h2 { font-size: 38px; }
  }
